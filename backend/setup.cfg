[flake8]
max-line-length = 100
max-complexity = 10
exclude =
    .git,
    __pycache__,
    */migrations/*,
    .venv,
    venv
extend-ignore = E203, W503

[isort]
profile = black
line_length = 100
skip = migrations

[coverage:run]
omit =
    */migrations/*
    */tests/*
    */apps.py
    config/wsgi.py
    config/asgi.py
    manage.py
