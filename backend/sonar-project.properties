sonar.projectKey=Dukeeee21_NexusRoute
sonar.projectName=NexusRoute
sonar.projectVersion=1.0.0

# Source & test layout
sonar.sources=apps,config,conftest.py
sonar.tests=apps
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/migrations/**,**/__pycache__/**

# Language
sonar.python.version=3.12

# Coverage (generated by pytest-cov as coverage.xml — run `pytest` first)
sonar.python.coverage.reportPaths=coverage.xml

# Running this locally requires a SonarQube/SonarCloud server + token:
#   sonar-scanner -Dsonar.host.url=<server> -Dsonar.login=<token>
# See docs/CALIDAD_ISO25010.md for what was checked without that server
# (flake8, isort, black, mccabe complexity — all passing as of Fase 7).
