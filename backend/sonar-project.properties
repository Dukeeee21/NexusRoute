sonar.projectKey=Dukeeee21_NexusRoute
sonar.projectName=NexusRoute
sonar.projectVersion=1.0.0

# Source & test layout
sonar.sources=apps,config
sonar.tests=apps
sonar.test.inclusions=**/tests/**
